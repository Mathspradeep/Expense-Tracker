<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupeeTrack - Expense, Income & Savings Tracker</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap)" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    
    <!-- Tailwind CSS -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen pb-10">

    <!-- Header Bar -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-extrabold flex items-center space-x-2">
            <i class="fa-solid fa-wallet"></i>
            <span>RupeeTrack</span>
        </h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Add/Edit Transaction Form -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Add Transaction</h2>
            </div>
            
            <form id="transactionForm" class="p-5 space-y-4">
                <input type="hidden" id="editTransactionId" value="">

                <!-- Type Selector -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">Type</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="type-btn border border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1" data-value="expense">
                            <i class="fa-solid fa-circle-minus"></i>
                            <span>Expense</span>
                        </button>
                        <button type="button" class="type-btn border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1" data-value="income">
                            <i class="fa-solid fa-circle-plus"></i>
                            <span>Income</span>
                        </button>
                        <button type="button" class="type-btn border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1" data-value="savings">
                            <i class="fa-solid fa-piggy-bank"></i>
                            <span>Savings</span>
                        </button>
                    </div>
                </div>

                <!-- Payment Mode Dropdown -->
                <div>
                    <label for="paymentMode" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">Payment Mode</label>
                    <select id="paymentMode" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                        <option value="" disabled selected>Select Payment Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="UPI">UPI</option>
                    </select>
                </div>

                <!-- Title Input -->
                <div>
                    <label for="title" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">Title</label>
                    <input type="text" id="title" placeholder="e.g. Grocery, Petrol, Rent" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                </div>

                <!-- Amount Input -->
                <div>
                    <label for="amount" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">Amount (₹)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition">
                    Save Transaction
                </button>
            </form>
        </div>

        <!-- Recent Transactions List -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Recent Transactions</h2>
            </div>
            <div id="transactionList" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                <!-- Transactions render here -->
            </div>
        </div>

    </main>

    <script>
        let transactions = JSON.parse(localStorage.getItem('rupeetrack_transactions')) || [];
        let selectedType = 'expense';

        const form = document.getElementById('transactionForm');
        const titleInput = document.getElementById('title');
        const amountInput = document.getElementById('amount');
        const paymentModeSelect = document.getElementById('paymentMode');
        const editIdInput = document.getElementById('editTransactionId');
        const transactionList = document.getElementById('transactionList');
        const typeBtns = document.querySelectorAll('.type-btn');

        // Type Button Selector Logic
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => {
                    b.classList.remove('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40', 'text-rose-600', 'dark:text-rose-400');
                    b.classList.add('border-slate-200', 'dark:border-slate-700', 'text-slate-600', 'dark:text-slate-400');
                });
                btn.classList.remove('border-slate-200', 'dark:border-slate-700', 'text-slate-600', 'dark:text-slate-400');
                btn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40', 'text-rose-600', 'dark:text-rose-400');
                selectedType = btn.dataset.value;
            });
        });

        // Form Submit Handler
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const editId = editIdInput.value;
            const transactionData = {
                id: editId ? Number(editId) : Date.now(),
                title: titleInput.value.trim(),
                amount: parseFloat(amountInput.value),
                type: selectedType,
                paymentMode: paymentModeSelect.value,
                date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            if (editId) {
                transactions = transactions.map(t => t.id === Number(editId) ? transactionData : t);
                editIdInput.value = '';
            } else {
                transactions.unshift(transactionData);
            }

            saveAndRender();
            form.reset();
            paymentModeSelect.selectedIndex = 0;
        });

        // Save & Render Function
        function saveAndRender() {
            localStorage.setItem('rupeetrack_transactions', JSON.stringify(transactions));
            renderTransactions();
        }

        // Render UI
        function renderTransactions() {
            if (transactions.length === 0) {
                transactionList.innerHTML = `<div class="p-6 text-center text-sm text-slate-400">No transactions recorded yet.</div>`;
                return;
            }

            transactionList.innerHTML = transactions.map(t => {
                const isExpense = t.type === 'expense';
                const amountColor = isExpense ? 'text-rose-500' : 'text-emerald-500';
                const sign = isExpense ? '-' : '+';

                return `
                    <div class="p-4 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-sm text-slate-800 dark:text-slate-200">${t.title}</span>
                                ${t.paymentMode ? `
                                    <span class="text-[10px] font-semibold uppercase tracking-wider bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-600">
                                        ${t.paymentMode}
                                    </span>
                                ` : ''}
                            </div>
                            <div class="text-xs text-slate-400 dark:text-slate-500">${t.date} • ${t.type.toUpperCase()}</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-extrabold text-sm ${amountColor}">
                                ${sign}₹${t.amount.toLocaleString('en-IN')}
                            </span>
                            <button onclick="editTransaction(${t.id})" class="text-slate-400 hover:text-indigo-500 text-xs">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-500 text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Edit Handler
        window.editTransaction = function(id) {
            const t = transactions.find(item => item.id === id);
            if (!t) return;

            titleInput.value = t.title;
            amountInput.value = t.amount;
            paymentModeSelect.value = t.paymentMode || '';
            editIdInput.value = t.id;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Delete Handler
        window.deleteTransaction = function(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRender();
        };

        // Initial Load
        renderTransactions();
    </script>
</body>
</html>
