<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupeeTrack - Expense & Wealth Tracker</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Chart.js for Visual Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF & AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-24">

    <!-- App Opening Splash Screen with Animated Rupee Symbol -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative flex items-center justify-center mb-5">
            <div class="w-28 h-28 rounded-full bg-indigo-600/20 border-2 border-indigo-500/40 flex items-center justify-center animate-ping"></div>
            <div class="absolute w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-2xl shadow-indigo-500/50 animate-bounce">
                <span class="text-white text-5xl font-black tracking-tight">₹</span>
            </div>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-1">
            <span>RupeeTrack</span>
        </h1>
        <p class="text-xs text-indigo-400 mt-1 font-semibold tracking-wider uppercase">Smart Wealth Manager</p>
    </div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-xl shadow-md shadow-indigo-600/30">₹</div>
            <h1 class="font-extrabold text-lg text-white tracking-tight">RupeeTrack</h1>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Clear Data Button -->
            <button onclick="clearAllData()" class="bg-slate-800 hover:bg-rose-950/40 text-slate-400 hover:text-rose-400 border border-slate-700/80 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden sm:inline">Clear All</span>
            </button>

            <!-- Add Button -->
            <button id="openModalBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-plus"></i>
                <span>Add</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

        <!-- Export Actions Bar -->
        <div class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-2xl flex items-center justify-between shadow-lg">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider pl-1 flex items-center space-x-1">
                <i class="fa-solid fa-file-export text-indigo-400 mr-1"></i> Export Reports
            </span>
            <div class="flex items-center space-x-2">
                <button onclick="exportToExcel()" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>Excel</span>
                </button>
                <button onclick="exportToPDF()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>PDF</span>
                </button>
            </div>
        </div>

        <!-- Overview Stat Cards -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800/60 border border-slate-700/60 p-3.5 rounded-2xl">
                <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block mb-1">Total Income</span>
                <div class="text-xl font-extrabold text-emerald-400" id="totalIncome">₹0</div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-3.5 rounded-2xl">
                <span class="text-[10px] font-bold text-rose-400 uppercase tracking-wider block mb-1">Total Expenses</span>
                <div class="text-xl font-extrabold text-rose-400" id="totalExpense">₹0</div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-3.5 rounded-2xl">
                <span class="text-[10px] font-bold text-sky-400 uppercase tracking-wider block mb-1">Total Savings</span>
                <div class="text-xl font-extrabold text-sky-400" id="totalSavings">₹0</div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-3.5 rounded-2xl">
                <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider block mb-1">Net Balance</span>
                <div class="text-xl font-extrabold text-indigo-400" id="netBalance">₹0</div>
            </div>
        </div>

        <!-- Chart Analytics Section -->
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-slate-700/50 pb-2">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                    <i class="fa-solid fa-chart-pie text-indigo-400"></i>
                    <span>Financial Breakdown</span>
                </h3>
            </div>
            <div class="relative h-48 w-full flex items-center justify-center">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>

        <!-- Recent Transactions Header -->
        <div class="flex items-center justify-between pt-1">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Transactions History</h2>
            <span class="text-xs text-slate-500" id="transactionCount">0 items</span>
        </div>

        <!-- Transaction List -->
        <div id="transactionList" class="space-y-2.5"></div>
    </main>

    <!-- Add/Edit Transaction Modal -->
    <div id="transactionModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <h3 class="font-bold text-slate-100 text-sm" id="modalTitle">Add Transaction</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-200 text-lg p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="transactionForm" class="p-5 space-y-4 overflow-y-auto">
                <input type="hidden" id="editTransactionId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Type</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="type-btn border border-indigo-500 bg-indigo-950/50 text-indigo-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1" data-value="expense">
                            <i class="fa-solid fa-circle-minus"></i>
                            <span>Expense</span>
                        </button>
                        <button type="button" class="type-btn border border-slate-700 text-slate-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1" data-value="income">
                            <i class="fa-solid fa-circle-plus"></i>
                            <span>Income</span>
                        </button>
                        <button type="button" class="type-btn border border-slate-700 text-slate-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1" data-value="savings">
                            <i class="fa-solid fa-piggy-bank"></i>
                            <span>Savings</span>
                        </button>
                    </div>
                </div>

                <div id="paymentModeContainer">
                    <label for="paymentMode" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Payment Mode</label>
                    <select id="paymentMode" class="w-full bg-slate-800 border border-slate-700 text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        <option value="" disabled selected>Select Payment Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="UPI">UPI</option>
                    </select>
                </div>

                <div>
                    <label for="category" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Category</label>
                    <select id="category" class="w-full bg-slate-800 border border-slate-700 text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required></select>
                </div>

                <div>
                    <label for="title" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Title / Note</label>
                    <input type="text" id="title" placeholder="e.g. Swiggy Order, Monthly Salary" class="w-full bg-slate-800 border border-slate-700 text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required />
                </div>

                <div>
                    <label for="amount" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Amount (₹)</label>
                    <input type="number" step="any" id="amount" placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required />
                </div>

                <div>
                    <label for="date" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Date</label>
                    <input type="date" id="date" class="w-full bg-slate-800 border border-slate-700 text-slate-200 py-2.5 px-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required />
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">
                    Save Transaction
                </button>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const categoryOptions = {
            expense: ["Food & Dining", "Groceries", "Transportation", "Utilities & Bills", "Shopping", "Entertainment", "Health & Medical", "Education", "Other Expense"],
            income: ["Salary", "Freelance & Side Business", "Investments & Dividends", "Rental Income", "Gifts & Allowances", "Other Income"],
            savings: ["Emergency Fund", "Mutual Funds & Stocks", "Fixed Deposit (FD/RD)", "Gold & Real Estate", "Crypto & Digital Assets", "Retirement Savings", "Other Savings"]
        };

        let transactions = JSON.parse(localStorage.getItem('rupeetrack_transactions')) || [];
        let selectedType = 'expense';
        let chartInstance = null;

        const modal = document.getElementById('transactionModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const transactionForm = document.getElementById('transactionForm');
        const typeBtns = document.querySelectorAll('.type-btn');
        const listElement = document.getElementById('transactionList');
        const paymentModeContainer = document.getElementById('paymentModeContainer');
        const paymentModeSelect = document.getElementById('paymentMode');
        const categorySelect = document.getElementById('category');

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.classList.add('opacity-0');
                setTimeout(() => splash.style.display = 'none', 700);
            }, 1800);
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            updateUIForType('expense');
            renderApp();
        });

        openModalBtn.addEventListener('click', () => openModal());
        closeModalBtn.addEventListener('click', () => closeModal());

        function openModal(editItem = null) {
            transactionForm.reset();
            document.getElementById('date').valueAsDate = new Date();
            
            if (editItem) {
                document.getElementById('modalTitle').textContent = 'Edit Transaction';
                document.getElementById('editTransactionId').value = editItem.id;
                document.getElementById('title').value = editItem.title;
                document.getElementById('amount').value = editItem.amount;
                if (editItem.rawDate) document.getElementById('date').value = editItem.rawDate;
                setType(editItem.type, editItem.category, editItem.paymentMode);
            } else {
                document.getElementById('modalTitle').textContent = 'Add Transaction';
                document.getElementById('editTransactionId').value = '';
                setType('expense');
            }
            modal.classList.remove('hidden');
        }

        function closeModal() { modal.classList.add('hidden'); }

        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => setType(btn.dataset.value));
        });

        function setType(type, currentCategory = '', currentPaymentMode = '') {
            selectedType = type;
            typeBtns.forEach(btn => {
                btn.className = btn.dataset.value === type 
                    ? "type-btn border border-indigo-500 bg-indigo-950/50 text-indigo-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1"
                    : "type-btn border border-slate-700 text-slate-400 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1";
            });
            updateUIForType(type, currentCategory, currentPaymentMode);
        }

        function updateUIForType(type, currentCategory = '', currentPaymentMode = '') {
            if (type === 'expense') {
                paymentModeContainer.classList.remove('hidden');
                paymentModeSelect.required = true;
                paymentModeSelect.value = currentPaymentMode || '';
            } else {
                paymentModeContainer.classList.add('hidden');
                paymentModeSelect.required = false;
                paymentModeSelect.value = '';
            }

            const categories = categoryOptions[type] || [];
            categorySelect.innerHTML = `<option value="" disabled ${!currentCategory ? 'selected' : ''}>Select ${type.charAt(0).toUpperCase() + type.slice(1)} Category</option>`;
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                if (cat === currentCategory) opt.selected = true;
                categorySelect.appendChild(opt);
            });
        }

        transactionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('editTransactionId').value;
            const dateInputVal = document.getElementById('date').value;
            const formattedDate = dateInputVal ? new Date(dateInputVal).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : new Date().toLocaleDateString('en-IN');

            const itemData = {
                id: editId ? Number(editId) : Date.now(),
                title: document.getElementById('title').value.trim(),
                amount: parseFloat(document.getElementById('amount').value),
                type: selectedType,
                category: categorySelect.value,
                paymentMode: selectedType === 'expense' ? paymentModeSelect.value : '',
                date: formattedDate,
                rawDate: dateInputVal
            };

            if (editId) {
                transactions = transactions.map(t => t.id === Number(editId) ? itemData : t);
            } else {
                transactions.unshift(itemData);
            }

            saveAndRender();
            closeModal();
        });

        function saveAndRender() {
            localStorage.setItem('rupeetrack_transactions', JSON.stringify(transactions));
            renderApp();
        }

        window.clearAllData = function() {
            if (transactions.length === 0) {
                alert("No transactions to clear.");
                return;
            }
            if (confirm("Are you sure you want to clear all transactions?")) {
                transactions = [];
                localStorage.removeItem('rupeetrack_transactions');
                renderApp();
            }
        };

        function renderApp() {
            renderTotals();
            renderList();
            renderChart();
        }

        function renderTotals() {
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            const savings = transactions.filter(t => t.type === 'savings').reduce((sum, t) => sum + t.amount, 0);
            const balance = income - expense - savings;

            document.getElementById('totalIncome').textContent = `₹${income.toLocaleString('en-IN')}`;
            document.getElementById('totalExpense').textContent = `₹${expense.toLocaleString('en-IN')}`;
            document.getElementById('totalSavings').textContent = `₹${savings.toLocaleString('en-IN')}`;
            document.getElementById('netBalance').textContent = `₹${balance.toLocaleString('en-IN')}`;
            document.getElementById('transactionCount').textContent = `${transactions.length} items`;
        }

        function renderList() {
            if (transactions.length === 0) {
                listElement.innerHTML = `
                    <div class="p-8 text-center text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-700/40">
                        <i class="fa-solid fa-receipt text-3xl mb-2 block text-slate-600"></i>
                        <p class="text-xs">No transactions recorded yet.</p>
                        <p class="text-[10px] text-slate-600 mt-1">Tap "+ Add" to create your first entry.</p>
                    </div>`;
                return;
            }

            listElement.innerHTML = transactions.map(t => {
                const isExpense = t.type === 'expense';
                const isSavings = t.type === 'savings';
                const colorClass = isExpense ? 'text-rose-400' : (isSavings ? 'text-sky-400' : 'text-emerald-400');
                const sign = isExpense ? '-' : '+';

                return `
                    <div class="bg-slate-800/60 border border-slate-700/60 p-3.5 rounded-2xl flex items-center justify-between">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-sm text-slate-100">${t.title}</span>
                                ${t.paymentMode ? `<span class="text-[10px] font-semibold uppercase bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md border border-slate-600">${t.paymentMode}</span>` : ''}
                            </div>
                            <div class="text-[11px] text-slate-400 flex items-center space-x-2">
                                <span>${t.date}</span>
                                <span>•</span>
                                <span class="uppercase font-semibold text-slate-400">${t.category || t.type}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-extrabold text-sm ${colorClass}">
                                ${sign}₹${t.amount.toLocaleString('en-IN')}
                            </span>
                            <button onclick="editItem(${t.id})" class="text-slate-400 hover:text-indigo-400 text-xs p-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem(${t.id})" class="text-slate-400 hover:text-rose-400 text-xs p-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('analyticsChart').getContext('2d');
            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const savings = transactions.filter(t => t.type === 'savings').reduce((s, t) => s + t.amount, 0);

            if (chartInstance) chartInstance.destroy();
            if (income === 0 && expense === 0 && savings === 0) {
                ctx.clearRect(0, 0, 300, 200);
                return;
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Income', 'Expense', 'Savings'],
                    datasets: [{
                        data: [income, expense, savings],
                        backgroundColor: ['#10b981', '#f43f5e', '#0284c7'],
                        borderWidth: 2,
                        borderColor: '#0f172a'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Inter', size: 11, weight: '600' }, boxWidth: 12, padding: 15 } }
                    }
                }
            });
        }

        window.editItem = function(id) {
            const t = transactions.find(item => item.id === id);
            if (t) openModal(t);
        };

        window.deleteItem = function(id) {
            if (confirm("Delete this transaction?")) {
                transactions = transactions.filter(t => t.id !== id);
                saveAndRender();
            }
        };

        // UNIVERSAL DOWNLOAD FUNCTION FOR ANDROID WebView & Web Browsers
        function saveReportFile(pureBase64, fileName, mimeType) {
            if (window.AndroidApp && window.AndroidApp.downloadBase64File) {
                window.AndroidApp.downloadBase64File(pureBase64, fileName, mimeType);
            } else {
                const dataUri = `data:${mimeType};base64,${pureBase64}`;
                const link = document.createElement('a');
                link.href = dataUri;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // Export to Excel
        window.exportToExcel = function() {
            if (transactions.length === 0) {
                alert("No transactions available to export.");
                return;
            }
            const exportData = transactions.map((t, idx) => ({
                "S.No": idx + 1,
                "Date": t.date,
                "Title": t.title,
                "Type": t.type.toUpperCase(),
                "Category": t.category || "General",
                "Payment Mode": t.paymentMode || "N/A",
                "Amount (INR)": t.amount
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "RupeeTrack Statement");

            const pureBase64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
            const mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
            const fileName = `RupeeTrack_Statement_${new Date().toISOString().split('T')[0]}.xlsx`;

            saveReportFile(pureBase64, fileName, mimeType);
        };

        // Export to PDF
        window.exportToPDF = function() {
            if (transactions.length === 0) {
                alert("No transactions available to export.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.setTextColor(79, 70, 229);
            doc.text("RupeeTrack - Statement", 14, 20);

            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100);
            doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN')}`, 14, 26);

            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const savings = transactions.filter(t => t.type === 'savings').reduce((s, t) => s + t.amount, 0);

            doc.setTextColor(50);
            doc.text(`Income: Rs.${income.toLocaleString('en-IN')}  |  Expenses: Rs.${expense.toLocaleString('en-IN')}  |  Savings: Rs.${savings.toLocaleString('en-IN')}`, 14, 33);

            const tableBody = transactions.map((t, idx) => [
                idx + 1,
                t.date,
                t.title,
                t.type.toUpperCase(),
                t.category || "General",
                t.paymentMode || "N/A",
                `Rs. ${t.amount.toLocaleString('en-IN')}`
            ]);

            doc.autoTable({
                startY: 38,
                head: [['#', 'Date', 'Title', 'Type', 'Category', 'Mode', 'Amount']],
                body: tableBody,
                theme: 'grid',
                headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold' },
                styles: { fontSize: 8 }
            });

            // Clean pure Base64 output
            const pureBase64 = doc.output('base64');
            const mimeType = 'application/pdf';
            const fileName = `RupeeTrack_Statement_${new Date().toISOString().split('T')[0]}.pdf`;

            saveReportFile(pureBase64, fileName, mimeType);
        };
    </script>
</body>
</html>
