<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupeeTrack - Expense Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel Export) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF & AutoTable (PDF Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center md:justify-between bg-indigo-600 text-white p-6 rounded-2xl shadow-lg">
            <div>
                <h1 class="text-2xl font-bold">RupeeTrack</h1>
                <p class="text-indigo-200 text-sm">Personal Finance & Expense Manager</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <button onclick="exportToExcel()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition">
                    Export Excel
                </button>
                <button onclick="exportToPDF()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition">
                    Export PDF
                </button>
            </div>
        </header>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Income</span>
                <p id="totalIncome" class="text-xl font-bold text-emerald-600 mt-1">Rs. 0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Expenses</span>
                <p id="totalExpense" class="text-xl font-bold text-rose-600 mt-1">Rs. 0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Savings</span>
                <p id="totalSavings" class="text-xl font-bold text-indigo-600 mt-1">Rs. 0</p>
            </div>
        </div>

        <!-- Transaction Form -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-bold mb-4">Add Transaction</h2>
            <form id="transactionForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="date" id="tDate" required class="p-2.5 border border-slate-200 rounded-xl focus:outline-indigo-500">
                <input type="text" id="tTitle" placeholder="Title (e.g. Salary, Groceries)" required class="p-2.5 border border-slate-200 rounded-xl focus:outline-indigo-500">
                <select id="tType" class="p-2.5 border border-slate-200 rounded-xl focus:outline-indigo-500">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                    <option value="savings">Savings</option>
                </select>
                <input type="text" id="tCategory" placeholder="Category (e.g. Food, Rent)" class="p-2.5 border border-slate-200 rounded-xl focus:outline-indigo-500">
                <select id="tMode" class="p-2.5 border border-slate-200 rounded-xl focus:outline-indigo-500">
                    <option value="UPI">UPI</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="Net Banking">Net Banking</option>
                </select>
                <input type="number" id="tAmount" placeholder="Amount (INR)" required class="p-2.5 border border-slate-200 rounded-xl focus:outline-indigo-500">
                <button type="submit" class="md:col-span-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl shadow transition">
                    Add Transaction
                </button>
            </form>
        </div>

        <!-- Transactions Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-100">
                <h2 class="text-lg font-bold">Transaction History</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
                            <th class="p-4">#</th>
                            <th class="p-4">Date</th>
                            <th class="p-4">Title</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Category</th>
                            <th class="p-4">Mode</th>
                            <th class="p-4 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable" class="divide-y divide-slate-100 text-sm">
                        <!-- Rows injected dynamically via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // State Array
        let transactions = JSON.parse(localStorage.getItem('rupeetrack_tx')) || [
            { date: '2026-03-28', title: 'Monthly Salary', type: 'income', category: 'Salary', paymentMode: 'Net Banking', amount: 65000 },
            { date: '2026-03-29', title: 'Grocery Shopping', type: 'expense', category: 'Food', paymentMode: 'UPI', amount: 3200 },
            { date: '2026-03-30', title: 'Fixed Deposit', type: 'savings', category: 'Investment', paymentMode: 'Net Banking', amount: 10000 }
        ];

        // DOM Elements
        const form = document.getElementById('transactionForm');
        const tableBody = document.getElementById('transactionTable');

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tDate').valueAsDate = new Date();
            renderUI();
        });

        // Form Submit Listener
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newTx = {
                date: document.getElementById('tDate').value,
                title: document.getElementById('tTitle').value,
                type: document.getElementById('tType').value,
                category: document.getElementById('tCategory').value || 'General',
                paymentMode: document.getElementById('tMode').value,
                amount: parseFloat(document.getElementById('tAmount').value) || 0
            };
            transactions.push(newTx);
            localStorage.setItem('rupeetrack_tx', JSON.stringify(transactions));
            form.reset();
            document.getElementById('tDate').valueAsDate = new Date();
            renderUI();
        });

        // Render UI Data
        function renderUI() {
            tableBody.innerHTML = '';
            let income = 0, expense = 0, savings = 0;

            transactions.forEach((t, idx) => {
                if (t.type === 'income') income += t.amount;
                if (t.type === 'expense') expense += t.amount;
                if (t.type === 'savings') savings += t.amount;

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/50 transition";
                row.innerHTML = `
                    <td class="p-4 text-slate-400">${idx + 1}</td>
                    <td class="p-4">${t.date}</td>
                    <td class="p-4 font-medium">${t.title}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded-md text-xs font-semibold ${
                            t.type === 'income' ? 'bg-emerald-100 text-emerald-700' :
                            t.type === 'expense' ? 'bg-rose-100 text-rose-700' : 'bg-indigo-100 text-indigo-700'
                        }">
                            ${t.type.toUpperCase()}
                        </span>
                    </td>
                    <td class="p-4">${t.category || 'General'}</td>
                    <td class="p-4">${t.paymentMode || 'N/A'}</td>
                    <td class="p-4 text-right font-semibold">Rs. ${t.amount.toLocaleString('en-IN')}</td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('totalIncome').innerText = `Rs. ${income.toLocaleString('en-IN')}`;
            document.getElementById('totalExpense').innerText = `Rs. ${expense.toLocaleString('en-IN')}`;
            document.getElementById('totalSavings').innerText = `Rs. ${savings.toLocaleString('en-IN')}`;
        }

        // --- EXPORT FUNCTIONS WITH NATIVE ANDROID SUPPORT ---

        // Helper function to save file natively in Android APK or fallback to Web Browser
        function saveReportFile(base64Data, fileName, mimeType) {
            if (window.AndroidApp && window.AndroidApp.downloadBase64File) {
                window.AndroidApp.downloadBase64File(base64Data, fileName, mimeType);
            } else {
                const link = document.createElement('a');
                link.href = base64Data;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // Export to Excel
        window.exportToExcel = function() {
            if (transactions.length === 0) {
                alert("No transactions available to export.");
                return;
            }
            const exportData = transactions.map((t, idx) => ({
                "S.No": idx + 1,
                "Date": t.date,
                "Title": t.title,
                "Type": t.type.toUpperCase(),
                "Category": t.category || "General",
                "Payment Mode": t.paymentMode || "N/A",
                "Amount (INR)": t.amount
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "RupeeTrack Statement");

            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
            const mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
            const base64Uri = `data:${mimeType};base64,${wbout}`;
            const fileName = `RupeeTrack_Statement_${new Date().toISOString().split('T')[0]}.xlsx`;

            saveReportFile(base64Uri, fileName, mimeType);
        };

        // Export to PDF
        window.exportToPDF = function() {
            if (transactions.length === 0) {
                alert("No transactions available to export.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header Title
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.setTextColor(79, 70, 229);
            doc.text("RupeeTrack - Statement", 14, 20);

            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100);
            doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN')}`, 14, 26);

            // Calculations
            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const savings = transactions.filter(t => t.type === 'savings').reduce((s, t) => s + t.amount, 0);

            doc.setTextColor(50);
            doc.text(`Income: Rs.${income.toLocaleString('en-IN')}  |  Expenses: Rs.${expense.toLocaleString('en-IN')}  |  Savings: Rs.${savings.toLocaleString('en-IN')}`, 14, 33);

            // Table Data
            const tableData = transactions.map((t, idx) => [
                idx + 1,
                t.date,
                t.title,
                t.type.toUpperCase(),
                t.category || "General",
                t.paymentMode || "N/A",
                `Rs. ${t.amount.toLocaleString('en-IN')}`
            ]);

            doc.autoTable({
                startY: 38,
                head: [['#', 'Date', 'Title', 'Type', 'Category', 'Mode', 'Amount']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold' },
                styles: { fontSize: 8 }
            });

            const mimeType = 'application/pdf';
            const base64Uri = doc.output('datauristring');
            const fileName = `RupeeTrack_Statement_${new Date().toISOString().split('T')[0]}.pdf`;

            saveReportFile(base64Uri, fileName, mimeType);
        };
    </script>
</body>
</html>
